<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="220" viewBox="0 0 1280 220" role="img" aria-label="arc-unpacker benchmarks: every tested repack, its own installer against arc-unpack">
  <defs>
    <clipPath id="frame"><rect width="1280" height="220" rx="20"/></clipPath>
    <linearGradient id="white-stream" gradientUnits="userSpaceOnUse" x1="860" y1="0" x2="1280" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="green-stream" gradientUnits="userSpaceOnUse" x1="820" y1="0" x2="1280" y2="0">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="220" rx="20" fill="#0a0a0a"/>

  <!-- The mark's streams, continued across the banner -->
  <g clip-path="url(#frame)">
    <polygon points="860,192 1300,-32 1300,4 860,228" fill="url(#white-stream)"/>
    <polygon points="820,264 1300,19 1300,55 820,300" fill="url(#green-stream)"/>
    <polygon points="940,254 1300,70 1300,106 940,290" fill="url(#white-stream)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="219" rx="19.5" fill="none" stroke="#27272a"/>

  <!-- Mark (docs/logo.svg) -->
  <g transform="translate(44 12) scale(0.38)">
    <g stroke-width="8" stroke-linejoin="round" transform="translate(256 258) scale(1.14) translate(-253 -259)">
      <polygon points="118,188 216,138 314,188 216,238" fill="#ffffff" stroke="#ffffff"/>
      <polygon points="104,202 206,254 206,380 104,328" fill="#a1a1aa" stroke="#a1a1aa"/>
      <polygon points="226,256 376,180 376,210 226,286" fill="#ffffff" stroke="#ffffff"/>
      <polygon points="226,302 402,212 402,242 226,332" fill="#22c55e" stroke="#22c55e"/>
      <polygon points="226,348 360,280 360,310 226,378" fill="#ffffff" stroke="#ffffff"/>
    </g>
  </g>

  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
    <text x="236" y="104" font-size="52" font-weight="700" fill="#fafafa" letter-spacing="-1">Benchmarks</text>
    <text x="238" y="144" font-size="23" fill="#a1a1aa">Every tested repack: its own installer against arc-unpack</text>
  </g>
</svg>
