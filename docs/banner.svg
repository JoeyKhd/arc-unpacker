<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="arc-unpacker: fast, parallel installer for FreeArc-based repacks">
  <defs>
    <clipPath id="frame"><rect width="1280" height="320" rx="20"/></clipPath>
    <linearGradient id="white-stream" gradientUnits="userSpaceOnUse" x1="820" y1="0" x2="1280" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="green-stream" gradientUnits="userSpaceOnUse" x1="780" y1="0" x2="1280" y2="0">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" rx="20" fill="#0a0a0a"/>

  <!-- The mark's streams, continued across the banner -->
  <g clip-path="url(#frame)">
    <polygon points="820,262 1300,17 1300,61 820,306" fill="url(#white-stream)"/>
    <polygon points="780,346 1300,81 1300,125 780,390" fill="url(#green-stream)"/>
    <polygon points="900,349 1300,145 1300,189 900,393" fill="url(#white-stream)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="19.5" fill="none" stroke="#27272a"/>

  <!-- Mark: a block whose right side leaves as parallel streams (docs/logo.svg) -->
  <g transform="translate(29 31) scale(0.5)">
    <g stroke-width="8" stroke-linejoin="round" transform="translate(256 258) scale(1.14) translate(-253 -259)">
      <polygon points="118,188 216,138 314,188 216,238" fill="#ffffff" stroke="#ffffff"/>
      <polygon points="104,202 206,254 206,380 104,328" fill="#a1a1aa" stroke="#a1a1aa"/>
      <polygon points="226,256 376,180 376,210 226,286" fill="#ffffff" stroke="#ffffff"/>
      <polygon points="226,302 402,212 402,242 226,332" fill="#22c55e" stroke="#22c55e"/>
      <polygon points="226,348 360,280 360,310 226,378" fill="#ffffff" stroke="#ffffff"/>
    </g>
  </g>

  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
    <text x="280" y="148" font-size="64" font-weight="700" fill="#fafafa" letter-spacing="-1.5">arc-unpacker</text>
    <text x="282" y="192" font-size="25" fill="#a1a1aa">Fast, parallel installer for FreeArc-based repacks</text>

    <g font-size="15" font-weight="600" fill="#d4d4d8">
      <rect x="282" y="218" width="188" height="32" rx="16" fill="none" stroke="#3f3f46"/>
      <text x="376" y="239" text-anchor="middle">Byte-identical installs</text>
      <rect x="482" y="218" width="158" height="32" rx="16" fill="none" stroke="#3f3f46"/>
      <text x="561" y="239" text-anchor="middle">Checks every file</text>
      <rect x="652" y="218" width="126" height="32" rx="16" fill="none" stroke="#3f3f46"/>
      <text x="715" y="239" text-anchor="middle">Windows x64</text>
    </g>
  </g>
</svg>
