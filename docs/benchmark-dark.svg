<text x="430" y="75" font-size="13" fill="#9198a1">original installer's</text>
<text x="645" y="34" font-size="30" font-weight="600" fill="#f0f6fc">31% → 68%</text>
<text x="645" y="58" font-size="13" fill="#9198a1">average CPU use,</text>
<text x="645" y="75" font-size="13" fill="#9198a1">original → arc-unpack</text>
