<svg xmlns="http://www.w3.org/2000/svg" width="860" height="228" viewBox="0 0 860 228" role="img" aria-label="Benchmark, same repack on the same PC. Original setup.exe: 4 min 47 s (install 3 min 20 s, then verify 1 min 27 s). arc-unpack with default settings, every check on: 1 min 14 s, 3.9 times faster. All 3,489 files byte-identical. Average CPU use 31% versus 68%.">
<title>Benchmark, same repack on the same PC. Original setup.exe: 4 min 47 s (install 3 min 20 s, then verify 1 min 27 s). arc-unpack with default settings, every check on: 1 min 14 s, 3.9 times faster. All 3,489 files byte-identical. Average CPU use 31% versus 68%.</title>
