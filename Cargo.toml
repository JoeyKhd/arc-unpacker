[package]
name = "arc-unpack"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
crc32fast = "1.5.5"
crossbeam-channel = "0.5.17"
indicatif = "0.18.6"
libloading = "0.9.1"
lzma-rs = { version = "0.3.0", features = ["stream"] }
md5 = "0.8.1"
serde = { version = "1.0.229", features = ["derive"] }
sha1_smol = "1.0.1"
toml = "1.2.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Diagnostics_Debug", "Win32_System_SystemServices", "Win32_System_JobObjects", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = "3.27.0"
