[package]
name = "arc-unpack"
version = "1.0.7-dev"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
crc32fast = "1.5.5"
crossbeam-channel = "0.5.17"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
indicatif = "0.18.6"
libloading = "0.9.1"
lzma-rs = { version = "0.3.0", features = ["stream"] }
# The LZMA1 decoder for archive data (1.5x the speed of lzma-rs on FitGirl data; it takes lc up to 8,
# which FitGirl uses: lc8:lp3:pb3). lzma-rs stays for the installer's own LZMA headers.
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "optimization"] }
md5 = "0.8.1"
# Exactly LZ4 1.9.4: the stand-in for FitGirl's LZ4 1.9.4 tool must compress identically.
lz4-sys = "=1.9.4"
rfd = "0.18.0"
png = "0.18"
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
sha1_smol = "1.0.1"
sha2 = "0.10"
# ISDone's IS7zipExtract (src/sevenz.rs): LZMA, LZMA2, PPMd, BCJ/BCJ2 and the other filters.
sevenz-rust2 = { version = "=0.25.0", default-features = false, features = ["ppmd"] }
toml = "1.2.2"
xxhash-rust = { version = "0.8", features = ["xxh32"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Diagnostics_Debug", "Win32_System_SystemServices", "Win32_System_JobObjects", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Memory", "Win32_UI_Shell", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_System_Environment", "Win32_System_LibraryLoader"] }

[features]
# Release builds: carry cls-host/unarc-host inside the main executables (see build.ps1).
embed-helpers = []

[dev-dependencies]
tempfile = "3.27.0"
sevenz-rust2 = { version = "=0.25.0", default-features = false, features = ["ppmd", "compress", "util"] }

# The GUI requests admin rights via its manifest; a test harness built from it could not start.
[[bin]]
name = "arc-unpack-gui"
path = "src/bin/arc-unpack-gui.rs"
test = false

# Stand-in for repack tools arc-unpack knows exactly (src/tools.rs).
[[bin]]
name = "arc-unpack-tool"
path = "src/bin/arc-unpack-tool.rs"

# The uninstaller put in every game folder (its own window, no test harness needed).
[[bin]]
name = "arc-unpack-uninstall"
path = "src/bin/arc-unpack-uninstall.rs"
test = false

[build-dependencies]
embed-resource = "3"
